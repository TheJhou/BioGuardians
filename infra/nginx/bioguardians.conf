# BioGuardians — Nginx reverse proxy
#
# Subdomains:
#   financemobile.com.br          → frontend (127.0.0.1:8080)
#   api.financemobile.com.br      → backend  (127.0.0.1:3001)
#   grafana.financemobile.com.br  → Grafana  (127.0.0.1:3000)
#   pgadmin.financemobile.com.br  → pgAdmin  (127.0.0.1:5050)
#   portainer.financemobile.com.br → Portainer (127.0.0.1:9443)
#
# Certificados Cloudflare Origin CA em /etc/cloudflare/
# NÃO commitar certificados/chaves no Git.

upstream frontend  { server 127.0.0.1:8080; }
upstream backend   { server 127.0.0.1:3001; }
upstream grafana   { server 127.0.0.1:3000; }
upstream pgadmin   { server 127.0.0.1:5050; }
upstream portainer { server 127.0.0.1:9443; }

# Redirect HTTP → HTTPS
server {
  listen 80;
  server_name
    financemobile.com.br
    api.financemobile.com.br
    grafana.financemobile.com.br
    pgadmin.financemobile.com.br
    portainer.financemobile.com.br;
  return 301 https://$host$request_uri;
}

# Frontend — financemobile.com.br
server {
  listen 443 ssl http2;
  server_name financemobile.com.br;
  ssl_certificate     /etc/cloudflare/origin-ca.crt;
  ssl_certificate_key /etc/cloudflare/origin-ca.key;
  location / {
    proxy_pass http://frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Backend API — api.financemobile.com.br
server {
  listen 443 ssl http2;
  server_name api.financemobile.com.br;
  ssl_certificate     /etc/cloudflare/origin-ca.crt;
  ssl_certificate_key /etc/cloudflare/origin-ca.key;
  client_max_body_size 10M;
  location / {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Grafana — grafana.financemobile.com.br
server {
  listen 443 ssl http2;
  server_name grafana.financemobile.com.br;
  ssl_certificate     /etc/cloudflare/origin-ca.crt;
  ssl_certificate_key /etc/cloudflare/origin-ca.key;
  location / {
    proxy_pass http://grafana;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# pgAdmin — pgadmin.financemobile.com.br
server {
  listen 443 ssl http2;
  server_name pgadmin.financemobile.com.br;
  ssl_certificate     /etc/cloudflare/origin-ca.crt;
  ssl_certificate_key /etc/cloudflare/origin-ca.key;
  location / {
    proxy_pass http://pgadmin;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# Portainer — portainer.financemobile.com.br
server {
  listen 443 ssl http2;
  server_name portainer.financemobile.com.br;
  ssl_certificate     /etc/cloudflare/origin-ca.crt;
  ssl_certificate_key /etc/cloudflare/origin-ca.key;
  location / {
    proxy_pass https://portainer;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_ssl_verify off;
  }
}
