# ============================================================
# BioGuardians - Production Docker Compose
# Used on the Oracle VM. References pre-built images from GHCR.
# PostgreSQL runs NATIVELY on the VM (not in Docker).
#
# GitHub Actions SCPs this file to the VM and runs:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
# ============================================================

services:
  # ---------- Backend API ----------
  backend:
    image: ghcr.io/thejhou/bioguardians-backend:latest
    container_name: bioguardians-backend
    restart: unless-stopped
    environment:
      # Connect to native PostgreSQL on the VM host.
      # host.docker.internal resolves to the host IP via extra_hosts below.
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@host.docker.internal:${DB_PORT}/${DB_NAME}
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      GBIF_API_BASE: https://api.gbif.org/v1
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

  # ---------- Frontend (nginx) ----------
  frontend:
    image: ghcr.io/thejhou/bioguardians-frontend:latest
    container_name: bioguardians-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
