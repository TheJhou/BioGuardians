# ============================================================
# BioGuardians - Production Docker Compose
# Used on the Oracle VM. References pre-built images from GHCR.
# PostgreSQL runs NATIVELY on the VM (not in Docker).
#
# Frontend (nginx) proxies /api to the backend container.
# Access: http://<VM_IP>:8080
# API:    http://<VM_IP>:8080/api/health
# ============================================================

services:
  # ---------- Backend API ----------
  backend:
    image: ghcr.io/thejhou/bioguardians-backend:latest
    container_name: bioguardians-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@host.docker.internal:${DB_PORT}/${DB_NAME}
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-https://financemobile.com.br}
      CORS_ORIGIN: ${FRONTEND_URL:-https://financemobile.com.br}
      GBIF_API_BASE: https://api.gbif.org/v1
      ML_SERVICE_URL: http://ml-service:8001
    ports:
      - "127.0.0.1:3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

  # ---------- ML Service (Python + FastAPI + YOLOv8) ----------
  ml-service:
    image: ghcr.io/thejhou/bioguardians-ml:latest
    container_name: bioguardians-ml
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@host.docker.internal:${DB_PORT}/${DB_NAME}
      INPE_EMAIL: ${INPE_EMAIL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-4}
      YOLO_DEVICE: ${YOLO_DEVICE:-cpu}
      YOLO_WORKERS: ${YOLO_WORKERS:-4}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      BATCH_CONCURRENCY: ${BATCH_CONCURRENCY:-4}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-120}
    ports:
      - "127.0.0.1:8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 48G
          cpus: "8"

  # ---------- Frontend (nginx + proxy reverso) ----------
  frontend:
    image: ghcr.io/thejhou/bioguardians-frontend:latest
    container_name: bioguardians-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
