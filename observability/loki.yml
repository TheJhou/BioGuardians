# Loki configuration — single binary, filesystem storage.
# Receives logs via OTLP/HTTP on /otlp/v1/logs (Loki 3.0+ native OTLP).

auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  allow_structured_metadata: true
  otlp_config:
    default_resource_attributes_as_index_labels:
      - service.name
      - deployment.environment
      - severity.text

# Enable OTLP ingestion endpoint.
distributor:
  otlp_config:
    default_resource_attributes_as_index_labels:
      - service.name
      - deployment.environment
