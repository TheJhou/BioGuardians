# Prometheus scrape configuration.
# Scrapes the OTel Collector's Prometheus exporter on :8889.
# The Collector translates OTLP metrics from the backend into Prometheus format.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          service: bioguardians-backend
