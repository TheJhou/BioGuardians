services:
  # ---------- Database (PostgreSQL + PostGIS) ----------
  db:
    image: postgis/postgis:16-3.4
    container_name: bioguardians-db
    restart: unless-stopped
    shm_size: 512mb
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required, copy .env.example to .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required, copy .env.example to .env}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required, copy .env.example to .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - bioguardians_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"

  # ---------- Migration runner (one-shot) ----------
  migrate:
    image: postgres:16-alpine
    container_name: bioguardians-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:?DB_NAME is required}
    volumes:
      - ./db:/db:ro
    entrypoint: ["bash", "/db/migrate.sh"]
    restart: "no"

  # ---------- Backend API (Node.js + Express) ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bioguardians-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      CACHE_TTL_MS: ${CACHE_TTL_MS:-30000}
      CACHE_MAX: ${CACHE_MAX:-100}
      GBIF_API_BASE: https://api.gbif.org/v1
      ML_SERVICE_URL: http://ml-service:8001
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./backend/src:/app/src:ro
    command: ["npx", "tsx", "watch", "src/index.ts"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

  # ---------- Frontend (React + Vite dev server) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bioguardians-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
      VITE_MAPTILER_API_KEY: ${VITE_MAPTILER_API_KEY:?VITE_MAPTILER_API_KEY is required}
    ports:
      - "5173:80"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"

  # ---------- ML Service (Python + FastAPI + YOLOv8, GPU) ----------
  # Local dev with NVIDIA RTX 4060 via Docker Desktop + WSL2.
  # Requires nvidia-container-toolkit (bundled in Docker Desktop >= 4.34).
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: bioguardians-ml
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-4}
      YOLO_DEVICE: ${YOLO_DEVICE:-cuda}
      YOLO_WORKERS: ${YOLO_WORKERS:-4}
      YOLO_BATCH_SIZE: ${YOLO_BATCH_SIZE:-32}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      BATCH_CONCURRENCY: ${BATCH_CONCURRENCY:-4}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-120}
      VLM_CONCURRENCY: ${VLM_CONCURRENCY:-8}
      IMAGE_STORAGE_DIR: /app/images
      DATA_DIR: /data
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      # Camera trap datasets (read-only) — mount under ./dados or wherever
      - ./dados:/data:ro
      # Persisted crops / downloaded images
      - bioguardians_ml_images:/app/images
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  bioguardians_pgdata:
  bioguardians_ml_images:
