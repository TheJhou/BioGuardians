services:
  db:
    image: postgis/postgis:16-3.4
    container_name: bioguardians-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bioguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bioguard}
      POSTGRES_DB: ${POSTGRES_DB:-bioguardians}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bioguardians_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bioguard} -d ${POSTGRES_DB:-bioguardians}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: postgres:16-alpine
    container_name: bioguardians-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-bioguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bioguard}
      POSTGRES_DB: ${POSTGRES_DB:-bioguardians}
    volumes:
      - ./db:/db:ro
    entrypoint: ["sh", "/db/migrate.sh"]
    restart: "no"

volumes:
  bioguardians_pgdata:
