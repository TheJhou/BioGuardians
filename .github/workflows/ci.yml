name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  database:
    name: Database migrations & smoke tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: bioguard
          POSTGRES_PASSWORD: bioguard
          POSTGRES_DB: bioguardians
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bioguard -d bioguardians"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: bioguard
      POSTGRES_PASSWORD: bioguard
      POSTGRES_DB: bioguardians

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Run migrations
        run: sh db/migrate.sh

      - name: Run smoke tests
        run: psql -v ON_ERROR_STOP=1 -h localhost -U bioguard -d bioguardians -f db/tests/smoke_test.sql

      - name: Verify migration idempotency
        run: sh db/migrate.sh
        # Second run should skip all migrations (already applied)
