name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".gitignore"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr

jobs:
  # ============================================================
  # Job 1: Validate schema in ephemeral PostGIS container
  # ============================================================
  validate:
    name: Validate schema (ephemeral)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ${{ secrets.DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          PGUSER: ${{ secrets.DB_USER }}
          PGDATABASE: ${{ secrets.DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries  10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Run migrations (ephemeral)
        run: bash db/migrate.sh

      - name: Run smoke tests (ephemeral)
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: psql -v ON_ERROR_STOP=1 -h localhost -U "$DB_USER" -d "$DB_NAME" -f db/tests/smoke_test.sql

      - name: Verify migration idempotency
        run: bash db/migrate.sh

  # ============================================================
  # Job 2: Typecheck backend
  # ============================================================
  backend-typecheck:
    name: Typecheck backend
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit

      - name: Build
        working-directory: backend
        run: npm run build

  # ============================================================
  # Job 3: Typecheck frontend
  # ============================================================
  frontend-typecheck:
    name: Typecheck frontend
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          VITE_MAPTILER_API_KEY: ${{ secrets.VITE_MAPTILER_API_KEY }}
        run: npm run build

  # ============================================================
  # Job 4: Prepare deploy
  # ============================================================
  prepare:
    name: Prepare deploy
    runs-on: ubuntu-latest
    needs: [validate, backend-typecheck, frontend-typecheck]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image:         ${{ steps.vars.outputs.image }}
      tag:           ${{ steps.vars.outputs.tag }}
      project_name:  ${{ steps.vars.outputs.project_name }}
      matrix:        ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Gera imagem base, tag SHA e project_name
        id: vars
        run: |
          OWNER_LOWER=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LOWER=$(printf '%s' "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="$REGISTRY/$OWNER_LOWER/$REPO_LOWER"
          echo "image=$IMAGE"              >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "project_name=$REPO_LOWER"  >> "$GITHUB_OUTPUT"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detecta mudancas por caminho (HEAD~1 -> HEAD)
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD || echo "")
          echo "$CHANGED" | grep -qE '^(backend/|db/)' && BE_CHANGED="true" || BE_CHANGED="false"
          echo "$CHANGED" | grep -qE '^(frontend/)'   && FE_CHANGED="true" || FE_CHANGED="false"
          if [ -z "$CHANGED" ]; then
            BE_CHANGED="true"
            FE_CHANGED="true"
          fi
          echo "frontend=$FE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "backend=$BE_CHANGED"  >> "$GITHUB_OUTPUT"

      - name: Valida integridade das migrations
        run: |
          cd db/migrations
          files=$(ls -1 [0-9][0-9][0-9]_*.sql 2>/dev/null | sort)
          if [ -z "$files" ]; then
            echo "ERROR: no migration files found"
            exit 1
          fi
          prev=0
          for f in $files; do
            num=$(echo "$f" | sed -E 's/^0*([0-9]+)_.*/\1/')
            if ! [ "$num" -gt 0 ] 2>/dev/null; then
              echo "ERROR: invalid migration filename: $f"
              exit 1
            fi
            if [ "$num" -ne "$((prev + 1))" ]; then
              echo "ERROR: migration numbers are not sequential. File $f, previous was $prev"
              exit 1
            fi
            prev=$num
          done
          echo "OK: $(echo "$files" | wc -l) migration files are sequential".

      - name: Monta matrix com flag should_build por servico
        id: matrix
        run: |
          MATRIX=$(jq -cn \
            --argjson f "${{ steps.changes.outputs.frontend }}" \
            --argjson b "${{ steps.changes.outputs.backend }}" '[
              {"service":"frontend","dockerfile":"frontend/Dockerfile","should_build":$f},
              {"service":"backend","dockerfile":"backend/Dockerfile","should_build":$b}
            ]')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # ============================================================
  # Job 5: Build and push images
  # ============================================================
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: prepare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepara build-args (VITE_* apenas para frontend)
        id: args
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "value=VITE_MAPTILER_API_KEY=${{ secrets.VITE_MAPTILER_API_KEY }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build e Push ${{ matrix.service }}
        if: ${{ matrix.should_build }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file:    ${{ matrix.dockerfile }}
          push:    true
          tags: |
            ${{ needs.prepare.outputs.image }}-${{ matrix.service }}:${{ needs.prepare.outputs.tag }}
            ${{ needs.prepare.outputs.image }}-${{ matrix.service }}:latest
          build-args: ${{ steps.args.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to:   type=gha,mode=max,scope=${{ matrix.service }}

      - name: Re-tag imagem inalterada com nova SHA
        if: ${{ !matrix.should_build }}
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAG:   ${{ needs.prepare.outputs.tag }}
        run: |
          docker pull "${IMAGE}-${{ matrix.service }}:latest"
          docker tag  "${IMAGE}-${{ matrix.service }}:latest" "${IMAGE}-${{ matrix.service }}:${TAG}"
          docker push "${IMAGE}-${{ matrix.service }}:${TAG}"

  # ============================================================
  # Job 6: Deploy migrations to production
  # ============================================================
  deploy-migrations:
    name: Deploy migrations (production)
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Run migrations (production)
        run: bash db/migrate.sh

      - name: Run smoke tests (production)
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: psql -v ON_ERROR_STOP=1 -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -f db/tests/smoke_test.sql

  # ============================================================
  # Job 7: Deploy application on Oracle VM
  # ============================================================
  deploy:
    name: Deploy app (Oracle VM)
    runs-on: ubuntu-latest
    needs: [prepare, deploy-migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.ORACLE_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Ensure deploy directory exists on VM
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.ORACLE_SSH_PORT || 22 }} \
            ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_SSH_HOST }} \
            'mkdir -p ~/bioguardians'

      - name: Create .env on VM with database credentials
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.ORACLE_SSH_PORT || 22 }} \
            ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_SSH_HOST }} \
            "printf 'DB_USER=%s\nDB_PASSWORD=%s\nDB_NAME=%s\nDB_PORT=%s\n' \
            '${{ secrets.DB_USER }}' '${{ secrets.DB_PASSWORD }}' '${{ secrets.DB_NAME }}' '${{ secrets.DB_PORT }}' \
            > ~/bioguardians/.env"

      - name: SCP docker-compose.prod.yml to VM
        run: |
          scp -i ~/.ssh/id_rsa -P ${{ secrets.ORACLE_SSH_PORT || 22 }} \
            docker-compose.prod.yml \
            ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_SSH_HOST }}:~/bioguardians/docker-compose.prod.yml

      - name: SCP observability files to VM
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.ORACLE_SSH_PORT || 22 }} \
            ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_SSH_HOST }} \
            'mkdir -p ~/bioguardians/observability/grafana/provisioning/datasources \
                      ~/bioguardians/observability/grafana/provisioning/dashboards \
                      ~/bioguardians/observability/grafana/dashboards'

          scp -i ~/.ssh/id_rsa -P ${{ secrets.ORACLE_SSH_PORT || 22 }} \
            docker-compose.observability.yml otel-collector-config.yaml \
            ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_SSH_HOST }}:~/bioguardians/

          scp -i ~/.ssh/id_rsa -P ${{ secrets.ORACLE_SSH_PORT || 22 }} \
            observability/prometheus.yml observability/tempo.yml observability/loki.yml \
            ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_SSH_HOST }}:~/bioguardians/observability/

          scp -i ~/.ssh/id_rsa -P ${{ secrets.ORACLE_SSH_PORT || 22 }} \
            observability/grafana/provisioning/datasources/datasources.yml \
            ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_SSH_HOST }}:~/bioguardians/observability/grafana/provisioning/datasources/

          scp -i ~/.ssh/id_rsa -P ${{ secrets.ORACLE_SSH_PORT || 22 }} \
            observability/grafana/provisioning/dashboards/dashboards.yml \
            ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_SSH_HOST }}:~/bioguardians/observability/grafana/provisioning/dashboards/

          scp -i ~/.ssh/id_rsa -P ${{ secrets.ORACLE_SSH_PORT || 22 }} \
            observability/grafana/dashboards/bioguardians-overview.json \
            ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_SSH_HOST }}:~/bioguardians/observability/grafana/dashboards/

      - name: Deploy containers
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.ORACLE_SSH_PORT || 22 }} \
            ${{ secrets.ORACLE_SSH_USER }}@${{ secrets.ORACLE_SSH_HOST }} \
            'cd ~/bioguardians && \
             sudo docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml pull && \
             sudo docker compose -f docker-compose.prod.yml -f docker-compose.observability.yml up -d && \
             sudo docker image prune -f'
